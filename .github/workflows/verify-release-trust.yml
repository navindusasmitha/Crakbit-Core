name: Verify Crakbit Release Trust

on:
  push:
    branches:
      - main
    paths:
      - 'release/**'
      - 'scripts/release-trust.py'
      - 'scripts/package-linux.sh'
      - 'tests/release_trust_unit.py'
      - 'docs/CRAK-025.md'
      - 'docs/PROJECT_STATE.md'
      - 'SOURCE_LOCK.json'
      - '.github/workflows/verify-release-trust.yml'
  pull_request:
    paths:
      - 'release/**'
      - 'scripts/release-trust.py'
      - 'scripts/package-linux.sh'
      - 'tests/release_trust_unit.py'
      - 'docs/CRAK-025.md'
      - 'docs/PROJECT_STATE.md'
      - 'SOURCE_LOCK.json'
      - '.github/workflows/verify-release-trust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-trust-unit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check CRAK-025 release trust tooling
        run: |
          python3 -m py_compile scripts/release-trust.py tests/release_trust_unit.py
          python3 -m json.tool release/RELEASE_POLICY.json >/dev/null
      - name: Install signature dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl
      - name: CRAK-025 tamper and Ed25519 regression tests
        run: python3 tests/release_trust_unit.py
      - name: Repository integrity includes CRAK-025
        run: python3 scripts/verify-repo-integrity.py

  attest-main-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install controlled release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libevent-dev libboost-dev libsqlite3-dev openssl
      - name: Verify source and repository policy
        run: |
          python3 scripts/verify-repo-integrity.py
          python3 scripts/verify-lock.py
      - name: Fetch exact pinned upstreams
        run: bash scripts/bootstrap.sh
      - name: Materialize locked Crakbit source tree
        run: bash scripts/materialize-locked.sh
      - name: Configure release node and CLI
        run: |
          cmake -S .work/crakbit -B .work/crakbit-release-build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_WALLET=ON \
            -DENABLE_EXTERNAL_SIGNER=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_ZMQ=OFF \
            -DWITH_EMBEDDED_ASMAP=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_DAEMON=ON \
            -DBUILD_CLI=ON \
            -DBUILD_TX=OFF \
            -DBUILD_UTIL=OFF \
            -DBUILD_BITCOIN_BIN=OFF
      - name: Build release inputs
        run: |
          cmake --build .work/crakbit-release-build --target bitcoind bitcoin-cli --parallel 2
          bash scripts/build-native-miner.sh .work/crakbit-release-build/bin/crakminer-scan
      - name: Build deterministic testnet release and trust manifest
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          CRAKBIT_VERSION="0.1.0-testnet" \
          CRAKBIT_SOURCE_COMMIT="$GITHUB_SHA" \
            bash scripts/package-linux.sh .work/crakbit-release-build dist
          ARCHIVE="$(find dist -maxdepth 1 -type f -name 'crakbit-core-*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$ARCHIVE"
          python3 scripts/release-trust.py manifest \
            --archive "$ARCHIVE" \
            --policy release/RELEASE_POLICY.json \
            --source-commit "$GITHUB_SHA" \
            --channel testnet \
            --output dist/RELEASE-MANIFEST.json
          python3 scripts/release-trust.py verify \
            --manifest dist/RELEASE-MANIFEST.json \
            --bundle dist
          cat dist/RELEASE-MANIFEST.json
      - name: Create keyless SLSA provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/crakbit-core-*.tar.gz
            dist/crakbit-core-*.tar.gz.sha256
            dist/RELEASE-MANIFEST.json
      - name: Upload trusted release proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: crakbit-trusted-release-${{ github.sha }}
          path: |
            dist/crakbit-core-*.tar.gz
            dist/crakbit-core-*.tar.gz.sha256
            dist/RELEASE-MANIFEST.json
          if-no-files-found: error
          retention-days: 14
