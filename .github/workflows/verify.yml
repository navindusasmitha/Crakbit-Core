name: Verify Crakbit migration locks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and consensus lock
        run: python3 scripts/verify-lock.py
      - name: Verify address-prefix reservations
        run: python3 scripts/verify-address-prefixes.py
      - name: Syntax-check bootstrap script
        run: bash -n scripts/bootstrap.sh

  upstream-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify WAM + yespower upstreams
        run: ./scripts/bootstrap.sh
      - name: Show resolved WAM source SHA
        run: cat .work/WAM_RESOLVED_SHA

  import-wam-upstream:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Clone and verify exact WAM release
        run: |
          git clone --branch v0.1.9 --single-branch https://gitlab.com/WAMCoin/wam-coin.git /tmp/wam-source
          test "$(git -C /tmp/wam-source rev-parse HEAD)" = "9c58108d3b021eaacdcf6bc92eb76cf720f31b6d"
      - name: Create workflow-free source snapshot
        run: |
          rm -rf /tmp/wam-snapshot
          cp -a /tmp/wam-source /tmp/wam-snapshot
          rm -rf /tmp/wam-snapshot/.git /tmp/wam-snapshot/.github/workflows
          printf '%s\n' '9c58108d3b021eaacdcf6bc92eb76cf720f31b6d' > /tmp/wam-snapshot/WAM_UPSTREAM_COMMIT
          git -C /tmp/wam-snapshot init
          git -C /tmp/wam-snapshot config user.name 'Crakbit Upstream Import'
          git -C /tmp/wam-snapshot config user.email 'noreply@crakbit.invalid'
          git -C /tmp/wam-snapshot add -A
          git -C /tmp/wam-snapshot commit -m 'WAM v0.1.9 source snapshot (9c58108d)'
      - name: Push isolated source snapshot branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C /tmp/wam-snapshot branch -M upstream/wam-v0.1.9
          git -C /tmp/wam-snapshot remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C /tmp/wam-snapshot push --force origin upstream/wam-v0.1.9
