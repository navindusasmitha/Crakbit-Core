name: Verify Crakbit Core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and consensus lock
        run: python3 scripts/verify-lock.py
      - name: Verify address-prefix reservations
        run: python3 scripts/verify-address-prefixes.py
      - name: Verify exact monetary schedule
        run: python3 scripts/verify_supply.py --schedule
      - name: Verify Bitcoin-compatible serialization
        run: python3 genesis/test_serialization.py
      - name: Verify Crakbit patch manifest
        run: python3 scripts/patch_upstream.py --list
      - name: Syntax-check shell entrypoints
        run: |
          bash -n scripts/bootstrap.sh
          bash -n install.sh

  source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned base source and yespower
        run: ./scripts/bootstrap.sh
      - name: Validate base-source layout
        run: python3 scripts/patch_upstream.py --check-tree
      - name: Stage Crakbit-owned overlay
        run: python3 scripts/patch_upstream.py --stage-overlay
      - name: Show resolved base-source SHA
        run: cat .work/BASE_RESOLVED_SHA
