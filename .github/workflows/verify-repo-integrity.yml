name: Verify Crakbit Repo Integrity

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check integrity verifier
        run: python3 -m py_compile scripts/verify-repo-integrity.py
      - name: Verify official repository and release path
        run: python3 scripts/verify-repo-integrity.py
