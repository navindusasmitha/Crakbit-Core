name: Crakbit testnet build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crakbit-testnet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-testnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config bsdmainutils \
            cmake git python3 libevent-dev libboost-dev libboost-system-dev \
            libboost-filesystem-dev libboost-test-dev libssl-dev libsqlite3-dev \
            nodejs npm

      - name: Verify Crakbit monetary policy
        run: python3 tests/test_policy.py

      - name: Materialize pinned source and mine genesis
        id: materialize
        env:
          CRAKBIT_JOBS: "2"
          CRAKBIT_GENESIS_THREADS: "2"
        run: |
          mkdir -p build/artifacts
          set +e
          bash scripts/materialize.sh 2>&1 | tee build/artifacts/materialize.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "### Materialize failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 build/artifacts/materialize.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            last="$(tail -n 1 build/artifacts/materialize.log | tr '\n' ' ' | cut -c1-220)"
            echo "::error title=Crakbit materialize failed::$last"
            exit "$rc"
          fi

      - name: Build node, CLI, wallet tools and CPU miner
        env:
          CRAKBIT_JOBS: "2"
          CRAKBIT_MINER_CXXFLAGS: "-O2 -mtune=generic"
        run: bash scripts/build-testnet.sh

      - name: Verify pool native addon and accounting tests
        run: |
          cd build/reference/pool
          npm install
          RANDOMX_INCLUDE="$GITHUB_WORKSPACE/build/reference/build/randomx/src" \
          RANDOMX_LIB="$GITHUB_WORKSPACE/build/reference/build/randomx/build/librandomx.a" \
          npm run build:native
          npm test

      - name: Verify explorer parses
        run: node --check build/reference/explorer/server.js

      - name: Start isolated node and verify block zero
        run: |
          bash scripts/testnet.sh init
          bash scripts/testnet.sh start
          build/dist/crakbit-cli \
            -datadir="$GITHUB_WORKSPACE/build/testnet-data" \
            -conf="$GITHUB_WORKSPACE/build/testnet-data/crakbit.conf" \
            getblockhash 0 > build/artifacts/node-genesis-hash.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('build/artifacts/testnet-genesis.json').read_text())['genesis_hash']
          actual = Path('build/artifacts/node-genesis-hash.txt').read_text().strip()
          if actual != expected:
              raise SystemExit(f'genesis mismatch: node={actual} artifact={expected}')
          print('genesis verified:', actual)
          PY
          bash scripts/testnet.sh stop

      - name: Record build identity
        if: always()
        run: |
          mkdir -p build/artifacts
          git rev-parse HEAD > build/artifacts/crakbit-source-commit.txt
          sha256sum build/dist/crakbit* > build/artifacts/SHA256SUMS 2>/dev/null || true

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crakbit-testnet-diagnostics
          path: |
            build/artifacts/materialize.log
            build/artifacts/crakbit-source-commit.txt
          if-no-files-found: warn

      - name: Upload testnet artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crakbit-testnet-linux
          path: |
            build/dist/
            build/artifacts/testnet-genesis.json
            build/artifacts/placeholder-main-genesis.json
            build/artifacts/regtest-genesis.json
            build/artifacts/node-genesis-hash.txt
            build/artifacts/materialized-source.txt
          if-no-files-found: error
